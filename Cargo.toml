[package]
name = "rust-shark"
version = "1.0.0"
edition = "2021"
description = "Fast native control app for the Attack Shark X6 mouse"
license = "MIT"
repository = "https://github.com/Abosmra/rust-shark"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.31"
hidapi = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
] }
tray-icon = "0.26.1"
raw-window-handle = "0.6"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1"
